[package]
name = "platform-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "platform-server"

[features]
integration = []

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "json", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
utoipa = { version = "5.5", features = ["uuid"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[[test]]
name = "database"
required-features = ["integration"]

[[test]]
name = "auth"
required-features = ["integration"]

[[test]]
name = "organizations"
required-features = ["integration"]

[[test]]
name = "workspaces"
required-features = ["integration"]

[[test]]
name = "context"
required-features = ["integration"]

[[test]]
name = "tenant_isolation"
required-features = ["integration"]

[[test]]
name = "rbac"
required-features = ["integration"]

[[test]]
name = "invitations"
required-features = ["integration"]
