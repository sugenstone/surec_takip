services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
      POSTGRES_DB: ${POSTGRES_DB:-platform_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: ['/app/migrate', 'up']
    environment: &database-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-platform_dev}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      <<: *database-environment
      SERVER_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-platform_server=info}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/app/probe']
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: development
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:5173'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./packages/ui/src:/workspace/packages/ui/src:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
